<section id="start-screen">
  <h1>Sorry Card Dealer</h1>
  <div class="start-colour">
    <p>Start colour</p>
    <div class="buttons">
      <button class="red"></button>
      <button class="blue"></button>
      <button class="yellow"></button>
      <button class="green"></button>
    </div>
  </div>
</section>
<section id="cards">
  <div id="colour" class="black">&nbsp;</div>
  <div class="card-wrapper">
    <div id="card">
      <div class='card-a'>
        <h2></h2>
        <p>Start</p>
      </div>
      <div class='card-b'>
        <h2>-</h2>
        <p>-</p>
      </div>
    </div>
  </div>
  <div class="footer buttons">
    <button id="reset">Reset</button>
  </div>
</section>
