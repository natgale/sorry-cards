<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry Card Dealer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="start-screen">
    <h1>Sorry Card Dealer</h1>
    <div class="start-colour">
      <p>Click colours in turn order</p>
      <div class="buttons">
        <button class="red" data-color="red"></button>
        <button class="blue" data-color="blue"></button>
        <button class="green" data-color="green"></button>
        <button class="yellow" data-color="yellow"></button>
      </div>
      <button id="start-game" class="start-btn" disabled>Start Game</button>
    </div>
  </section>
  <section id="cards">
    <div id="colour" class="black">&nbsp;</div>
    <div class="card-wrapper">
      <div id="card">
        <div class='card-a'>
          <h2></h2>
          <p>Start</p>
        </div>
        <div class='card-b'>
          <h2>-</h2>
          <p>-</p>
        </div>
      </div>
    </div>
    <div class="footer buttons">
      <button id="reset">Reset</button>
    </div>
  </section>
  <script type="module" src="./script.js"></script>
</body>
</html>
